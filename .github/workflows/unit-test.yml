name: Unit-test

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - "*.md"

jobs:
  unit-test:
    name: Unit test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      #- name: Use Node.js 22 for NAPI build
      #  uses: actions/setup-node@v7
      #  with:
      #    node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run native_build_env # Build node addon on windows
      - name: Use Node.js ${{ matrix.node-version }} for test
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run test
        env:
          CI: true
          #DEBUG: 'win-sso'
