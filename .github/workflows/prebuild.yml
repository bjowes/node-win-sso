name: Prebuild

on:
  push:
    paths-ignore:
      - "*.md"
  pull_request:
    paths-ignore:
      - "*.md"

jobs:
  prebuild:
    name: Prebuild node addon
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        node-version: [22]
        architecture: [x64, x86]
        #include:
        #  - os: windows-latest
        #    node-version: 16
        #    architecture: x86
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.architecture }}
      - run: npm ci
      - run: npm run build
      - run: npm run native_prebuildify # Build node addon on windows
        env:
          CI: true
      - name: Archive prebuild Node addon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-node-addon-win-${{ matrix.architecture }}
          path: |
            native/prebuilds/*

